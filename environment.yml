# BCFP build + runtime environment (conda-forge).
#
# RDKit's C++ side comes from conda-forge: `librdkit-dev` ships the headers and libraries the
# extension compiles against, while `rdkit` supplies the Python runtime. BCFP's Python extension
# itself is built with nanobind. See BUILD.md for testing against RDKit's optional nanobind Python
# wrappers; the stock conda-forge RDKit package still uses Boost.Python in 2026.09.2.
#
#   conda env create -f environment.yml     # or: mamba env create -f environment.yml
#   conda activate bcfp
#   pip install -e .
#
name: bcfp
channels:
  - conda-forge
dependencies:
  - python=3.12
  - rdkit=2026.09.2         # Latest tested Python runtime
  - librdkit-dev=2026.09.2  # Matching RDKit C++ headers and libraries
  - libboost-devel         # Boost headers (pulled in by RDKit's headers)
  - nanobind>=2.4,<3         # RDKit 2026.09 nanobind wrappers require major version 2
  - scikit-build-core>=0.10
  - cmake
  - ninja
  - xxhash                 # Header-only C++ API used by src/bcfp.cpp
  - cxx-compiler           # C++20-capable clang/gcc toolchain
  - numpy>=1.23,<2
  - scipy>=1.5
  - pytest>=7.0
  - pip
  # Optional, for the ML examples/benchmarks:
  - scikit-learn
  - pandas
  - xgboost
