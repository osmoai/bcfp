name: test

on:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: bcfp
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true

      - name: Build BCFP
        run: python -m pip install --no-build-isolation -e .

      - name: Install chemfp 5.2b1
        run: >-
          python -m pip install
          --extra-index-url https://chemfp.com/packages/
          chemfp==5.2b1

      - name: Test
        run: pytest -q
