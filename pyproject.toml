[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4,<3"]
build-backend = "scikit_build_core.build"

[project]
name = "bcfp"
version = "2.1.0"
description = "High-performance molecular fingerprints (ECFP/BCFP) with 3 hash functions (RDKit-native, xxHash, BLAKE3)"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
keywords = ["molecular-fingerprints", "ecfp", "bcfp", "cheminformatics", "hash-functions"]
authors = [
  {name = "BCFP Contributors"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
  # 2026.09.2 tested (see BUILD.md). C++ headers come from conda-forge librdkit-dev.
  "rdkit>=2026.9.2",
  "numpy>=1.23,<2",
  # NOTE: no xxhash/blake3 here on purpose — hashing lives in the C++ core (xxhash is header-only,
  # blake3 is vendored under src/vendor/blake3), so no Python hash packages are required.
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=3.0.0"]
ml = ["xgboost>=1.5.0", "scikit-learn>=0.24.0", "pandas>=1.2.0"]

[project.urls]
Homepage = "https://github.com/osmoai/bcfp"
Documentation = "https://github.com/osmoai/bcfp#readme"
Repository = "https://github.com/osmoai/bcfp.git"
Issues = "https://github.com/osmoai/bcfp/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["bcfp"]

